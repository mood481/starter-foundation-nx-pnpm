schema: spec-driven

context: |
  This is __PROJECT_NAME__, an MWS-compatible generated project from __STARTER_ID__ __STARTER_VERSION__.

  __PROJECT_DESCRIPTION__

  MWS identity:
  - Project id: __PROJECT_ID__.
  - Starter variant: mws.
  - Lifecycle phase: foundation.

  This project uses OpenSpec for spec-driven development. The foundation provides an MWS-compatible Nx + pnpm monorepo baseline with multi-language workspace support.

  MWS foundation scope:
  - The repository is traceable by MWS through `mws.project.yaml`.
  - The repository starts in the foundation lifecycle phase with no modules selected by default.
  - Application, service, API, worker, package, infrastructure, auth, storage, eventing, and observability modules are added only through later approved changes or module starters.

  Project domain (editable):
  - [Describe the domain and industry context this project serves.]

  Users and stakeholders (editable):
  - [Describe who uses this project and what stakeholders influence its design.]

  Runtime stack (editable):
  - [Describe runtime choices, including languages, compute platforms, storage, and infrastructure.]

  Delivery, compliance, and constraints (editable):
  - [Describe delivery expectations, compliance requirements, and integration or operational constraints.]

  Project-specific terminology (editable):
  - [Define project-specific terminology that is important for this project's specs.]

  Starter provenance:
  - Generated from __STARTER_ID__ version __STARTER_VERSION__.
  - Foundation baseline: Nx, pnpm, OpenSpec SDD.
  - Selected variant: mws.
  - Multi-language workspace: TypeScript as orchestration language; supports TypeScript, Python, Go, and future runtimes.

rules:
  proposal:
    - "Use the canonical proposal sections `## Why`, `## What Changes`, and `## Impact`."
    - "`## Why` must describe the problem, opportunity, or constraint that motivates the change."
    - "`## What Changes` must describe the proposed change as concrete bullets."
    - "`## Impact` must identify affected specs, MWS metadata, lifecycle state, generated-project files, tooling, and validation behaviour."
    - "Add `## Out of Scope` when the change deliberately excludes related MWS modules or capabilities."
    - "Add `## Risks` when the change affects lifecycle state, module boundaries, validation, rendering, metadata, or automation."
    - State whether the change affects foundation metadata, future modules, generated-project specs, or workspace tooling.
    - Do not add modules implicitly; module additions require explicit scope and validation.

  specs:
    - "Use `## ADDED Requirements`, `## MODIFIED Requirements`, `## REMOVED Requirements`, or `## RENAMED Requirements`."
    - "Each requirement must use `### Requirement: ...`."
    - "Each requirement must include at least one `#### Scenario: ...`."
    - Requirements must describe externally observable behaviour, contracts, constraints, or verifiable outcomes.
    - "Use `SHALL`, `MUST`, `SHOULD`, `MAY` per RFC 2119."
    - "Move implementation details, file-by-file plans, prompts, and execution mechanics to `design.md` or `tasks.md`."
    - Keep specs deterministic enough for automation to validate from repository artifacts.
    - Distinguish foundation lifecycle requirements from future module-specific requirements.

  design:
    - "Use these minimum sections: `## Context`, `## Goals / Non-Goals`, `## Decisions`, `## Constraints`, `## Alternatives Considered`, `## Risks / Trade-offs`, and `## Validation Strategy`."
    - Design documents should explain how implementation will work, not redefine requirements.
    - Justify decisions against alternatives considered.
    - Address MWS metadata, lifecycle, automation, and validation implications when relevant.
    - Do not rely on local assistant command packs or interactive tooling as part of the project contract.

  tasks:
    - Use checkbox tasks with `- [ ]`.
    - Group tasks by implementation area.
    - Include explicit validation tasks.
    - Include tasks for metadata, lifecycle, and OpenSpec validation when a change affects MWS foundation state.
    - Keep tasks deterministic and reviewable by humans and automation.
