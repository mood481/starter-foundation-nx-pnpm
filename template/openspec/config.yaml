rules:
  proposal:
    - "Use the canonical proposal sections `## Why` and `## What Changes`."
    - "`## Why` must describe the problem, opportunity, or constraint that motivates the change."
    - "`## What Changes` must describe the proposed change as concrete bullets."
    - "Add `## Impact` identifying affected specs, capabilities, and project areas."
    - Enumerate capabilities affected by the change.

  specs:
    - "Use `## ADDED Requirements`, `## MODIFIED Requirements`, `## REMOVED Requirements`, or `## RENAMED Requirements`."
    - "Each requirement must use `### Requirement: ...`."
    - "Each requirement must include at least one `#### Scenario: ...`."
    - Requirements must describe externally observable behaviour, contracts, or verifiable outcomes.
    - "Use `SHALL`, `MUST`, `SHOULD`, `MAY` per RFC 2119."
    - "Move implementation details, file-by-file plans, and execution mechanics to `design.md` or `tasks.md`."

  design:
    - "Use these minimum sections: `## Context`, `## Goals / Non-Goals`, `## Decisions`, `## Constraints`, `## Risks / Trade-offs`."
    - Design documents should explain how implementation will work, not redefine requirements.
    - Justify decisions against alternatives considered.
    - Address constraints and risks explicitly.

  tasks:
    - Use checkbox tasks with `- [ ]`.
    - Group tasks by implementation area.
    - Include explicit validation tasks.
