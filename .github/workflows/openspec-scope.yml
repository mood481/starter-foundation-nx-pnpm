name: OpenSpec scope

on:
  pull_request:
    branches:
      - devel

permissions:
  contents: write

concurrency:
  group: openspec-scope-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: OpenSpec scope
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Detect OpenSpec-relevant change
        id: detect
        run: |
          base_ref="${{ github.base_ref }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          merge_base=$(git merge-base "origin/${base_ref}" "$head_sha")
          changed=false
          if git diff --name-only "$merge_base" "$head_sha" \
             | grep -E '^(openspec/config\.yaml|\.opencode/commands/|\.opencode/skills/|openspec/)' >/dev/null; then
            changed=true
          fi
          if git diff "$merge_base" "$head_sha" -- package.json \
             | grep -E '^\+[^+]*"@fission-ai/openspec"'; then
            changed=true
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22

      - name: Enable pnpm
        if: steps.detect.outputs.changed == 'true'
        run: corepack enable

      - name: Install dependencies without lifecycle scripts
        if: steps.detect.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure the OpenSpec profile
        if: steps.detect.outputs.changed == 'true'
        run: |
          workflows=$(node -e 'const{pathToFileURL}=require("url");const{resolve}=require("path");import(pathToFileURL(resolve("node_modules/@fission-ai/openspec/dist/core/profiles.js")).href).then(m=>process.stdout.write(JSON.stringify(m.ALL_WORKFLOWS)))')
          echo "Workflows offered by the pinned OpenSpec version: ${workflows}"
          pnpm exec openspec config set profile custom
          pnpm exec openspec config set delivery both
          pnpm exec openspec config set workflows "${workflows}"

      - name: Regenerate OpenSpec tooling
        if: steps.detect.outputs.changed == 'true'
        run: pnpm ospec:update

      - name: Commit regenerated OpenSpec tooling (Renovate branches only)
        if: steps.detect.outputs.changed == 'true' && startsWith(github.head_ref, 'renovate/')
        run: |
          git add .opencode/commands .opencode/skills
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate OpenSpec tooling for dependency update"
            git push
          fi

      - name: Reject generated tooling drift
        if: steps.detect.outputs.changed == 'true'
        run: |
          status=$(git status --porcelain -- .opencode/commands .opencode/skills)
          if [ -n "$status" ]; then
            echo "Generated OpenSpec tooling drift detected:"
            echo "$status"
            exit 1
          fi

      - name: Reject non-generated drift
        if: steps.detect.outputs.changed == 'true'
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "Non-generated drift detected:"
            echo "$status"
            exit 1
          fi

      - name: Validate OpenSpec (no strict)
        if: steps.detect.outputs.changed == 'true'
        run: pnpm exec openspec validate --all
