name: OpenSpec scope

on:
  pull_request:
    branches:
      - devel
    paths:
      - openspec/config.yaml
      - .opencode/commands/**
      - .opencode/skills/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - renovate.json
      - .github/workflows/openspec-scope.yml

permissions:
  contents: write

concurrency:
  group: openspec-scope-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: OpenSpec scope
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Detect OpenSpec-relevant change
        id: detect
        run: |
          changed=false
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
             | grep -E '^(openspec/config\.yaml|\.opencode/commands/|\.opencode/skills/|openspec/)' >/dev/null; then
            changed=true
          fi
          if git diff "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- package.json \
             | grep -E '^\+[^+]*"@fission-ai/openspec"'; then
            changed=true
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Configure the OpenSpec profile
        if: steps.detect.outputs.changed == 'true'
        run: |
          pnpm exec openspec config set profile custom
          pnpm exec openspec config set delivery both
          pnpm exec openspec config set workflows '["propose","explore","new","continue","apply","update","ff","sync","verify","onboard"]'

      - name: Regenerate OpenSpec tooling
        if: steps.detect.outputs.changed == 'true'
        run: pnpm ospec:update

      - name: Commit regenerated OpenSpec tooling (Renovate branches only)
        if: steps.detect.outputs.changed == 'true' && startsWith(github.head_ref, 'renovate/')
        run: |
          git add .opencode/commands .opencode/skills
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate OpenSpec tooling for dependency update"
            git push
          fi

      - name: Reject generated tooling drift
        if: steps.detect.outputs.changed == 'true'
        run: |
          status=$(git status --porcelain -- .opencode/commands .opencode/skills)
          if [ -n "$status" ]; then
            echo "Generated OpenSpec tooling drift detected:"
            echo "$status"
            exit 1
          fi

      - name: Reject non-generated drift
        if: steps.detect.outputs.changed == 'true'
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "Non-generated drift detected:"
            echo "$status"
            exit 1
          fi

      - name: Validate OpenSpec artifacts
        if: steps.detect.outputs.changed == 'true'
        run: pnpm ospec:validate
