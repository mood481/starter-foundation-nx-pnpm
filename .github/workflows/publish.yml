name: Publish renderer package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Prerelease suffix to publish, e.g. devel.0, alpha.1, beta.1 or rc.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Gitea
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Verify release tag
        if: github.event_name == 'push'
        env:
          PUBLISH_RELEASE: 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { resolvePublishPlan } from './tools/scripts/publish-package.mjs';

          const packageJson = JSON.parse(await readFile('package.json', 'utf8'));
          const plan = resolvePublishPlan({version: packageJson.version, env: process.env});
          console.log(`Release tag accepted: ${plan.version} -> ${plan.tag}`);
          NODE

      - name: Publish package
        run: pnpm publish:render
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.example
          PUBLISH_RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
          PUBLISH_PRERELEASE: ${{ inputs.prerelease }}
