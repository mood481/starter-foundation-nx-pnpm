schema: spec-driven

context: |
  Repository: starter-foundation-nx-pnpm, a neutral renderable foundation for strict multi-language monorepos based on Nx and pnpm.

  Keep two surfaces distinct:
  - Starter repository: owns the starter source plus canonical OpenSpec specs and active changes under root openspec/. Root change artifacts must never become generated-project content.
  - Generated project: sources live under template/ as the neutral Nx + pnpm baseline. Generated SDD content is opt-in and must come from an explicitly selected variant overlay or extension artifact. The neutral template must remain independent from concrete variants and extensions.

  Variant model:
  - `variant` is the catalog-level adaptation selected by a consumer.
  - `overlay` is the technical file/rule layer applied on top of template/.
  - Concrete variant files live under variants/<variant-id>/overlay/, never inside the neutral template.
  - The approved `mws` variant is a foundation-only overlay; the neutral template must remain usable without it or any other variant.

  Technical baseline:
  - Package manager: pnpm; workspace orchestrator: Nx; primary orchestration language: JavaScript/TypeScript.
  - Generated monorepos may contain TypeScript, Python, Go, and future approved runtimes; do not assume every app, service, or package belongs to the JavaScript ecosystem.

  Repository boundaries:
  - Use English for specs, changes, templates, docs, and metadata; use kebab-case for change and capability IDs.
  - The neutral starter may define starter.yaml, template/, validation expectations, and declarations of approved variants and optional extensions. External extension artifacts do not need a repository-local directory.
  - MWS-specific generated files or metadata belong under variants/mws/overlay/ and apply only when the mws variant is selected.
  - Neutral starter changes must not introduce concrete API, mobile, web, service, auth, eventing, storage, or infrastructure modules.

rules:
  proposal:
    - State whether the change affects the starter repository, the generated template, or both; identify affected generated-project surfaces or files when relevant.
    - Keep scope proportional to risk and reviewability; make deliberate exclusions and material risks explicit when they matter.
    - Target about 25 implementation and validation tasks; if the expected plan exceeds 30, split the change unless it defines one cohesive foundation contract that would become harder to review or validate if divided.
    - Do not introduce or modify concrete variants unless the change explicitly concerns variants.
    - Use `variant` and `overlay` terminology; do not introduce new `flavour` metadata.

  specs:
    - Use SHALL for required starter/template behaviour and MUST/MUST NOT for hard compatibility, safety, process, or boundary constraints; avoid SHOULD/MAY for normative requirements.
    - Distinguish starter-repository behaviour from generated-template behaviour when both surfaces are involved.
     - When referring to generated SDD content, identify the selected variant or extension that owns it; do not describe it as part of the neutral template baseline.
    - Never require root `openspec/changes/` artifacts from the starter repository to be copied into generated projects.
    - Keep neutral-template requirements free of concrete variant assumptions unless the change explicitly introduces or modifies variants.

  design:
    - Keep starter-maintenance artifacts separate from importable generated-template artifacts.
    - When relevant, address repository structure, template structure, rendering/overlay behaviour, migration implications, and compatibility with future variants, module starters, and multi-language generated projects within the standard design structure.
    - Make starter/template separation and variant-neutrality constraints explicit when they affect implementation choices.

  tasks:
    - Keep the complete implementation and validation plan within 30 checkboxes; target about 25. If the plan exceeds that, revisit the proposal scope before proceeding.
    - Place broader integration validation in a final numbered `## N. Validation` group; include OpenSpec strict validation there.
    - Validation tasks must prefer repository-declared, lockfile-resolved tooling when available; external resolution is appropriate only when it is itself under test.
    - When template rendering is affected, include deterministic verification that generated output is complete and contains no unresolved placeholders.
    - When the neutral template is affected, verify that no forbidden variant-specific files or assumptions were introduced.
    - When variants or overlays are affected, verify correct overlay placement and consistent `variant`/`overlay` terminology.

operations:
  apply:
    guidance:
      - Preserve starter-repository/generated-template separation and variant neutrality throughout implementation.
      - Never copy root openspec/changes/ artifacts into template/ or generated output.
      - Make variant-specific edits only when the active change explicitly introduces or modifies that variant, and keep variant files under variants/<variant-id>/overlay/.
      - Use repository-declared, lockfile-resolved tooling when available. Do not use commands that may download or resolve an external tool as a substitute for an installed project tool, unless that resolution mechanism is itself the behavior being tested.
      - Do not mark a task complete until the verification stated by that task has inspectable local evidence.
