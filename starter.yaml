id: foundation-nx-pnpm
name: Foundation Nx pnpm Monorepo
kind: foundation
version: 0.1.0

template:
  path: template
  engine: starter-renderer
  placeholders:
    style: double-underscore
    failOnUnresolved: true
    required:
      - PROJECT_NAME
      - PROJECT_SLUG
      - PROJECT_DESCRIPTION
      - DEFAULT_PACKAGE_SCOPE

sdd:
  provider: openspec
  root: openspec
  importable:
    - template/openspec/specs

variants:
  mws:
    name: MWS Foundation Variant
    description: MWS-compatible foundation overlay for generated monorepos.
    overlay:
      path: variants/mws/overlay
    placeholders:
      required:
        - PROJECT_ID
    validations:
      - pnpm validate:template:mws

provides:
  - monorepo
  - nx-workspace
  - pnpm-workspace
  - openspec-sdd
  - quality-gates
  - multi-language-workspace

paths:
  apps: apps
  services: services
  packages: packages
  tools: tools
  docs: docs
  sdd: openspec

projectRules:
  configFile: project.json
  requiredTargets:
    - lint
    - test
  optionalTargets:
    - typecheck
    - build
    - e2e
    - serve
    - docker
  requiredTags:
    - type
    - lang

validations:
  - pnpm install --frozen-lockfile
  - pnpm validate
  - pnpm nx graph --file=tmp/nx-graph.json
