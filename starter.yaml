schemaVersion: 1
id: foundation-nx-pnpm
name: Foundation Nx pnpm Monorepo
kind: foundation
modes:
  standalone: {}
defaultMode: standalone

template:
  path: template
  placeholders:
    required:
      - PROJECT_NAME
      - PROJECT_SLUG
      - PROJECT_DESCRIPTION
      - DEFAULT_PACKAGE_SCOPE

variants:
  mws:
    name: MWS Foundation Variant
    description: MWS-compatible foundation overlay for generated monorepos.
    overlay:
      path: variants/mws/overlay
    placeholders:
      required:
        - PROJECT_ID

provides:
  - workspace
  - nx
  - pnpm
  - multi-language
